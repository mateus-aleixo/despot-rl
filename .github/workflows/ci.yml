name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The runner image ships a stable Rust toolchain, and the core has no
      # dependencies, so a cold release build takes seconds.
      - name: Build the Rust core
        run: cargo build --release --manifest-path core/Cargo.toml

      # CPU torch from PyTorch's own index: the default wheel pulls in the CUDA
      # stack, gigabytes the tests never touch.
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      # No game data exists here (it is never redistributed), so the tests that
      # need it skip. DESPOT_REQUIRE_CORE turns a missing core from a skip into
      # a failure, so the parity tests cannot pass by not running.
      - name: Test
        env:
          DESPOT_REQUIRE_CORE: "1"
        run: pytest -v -rs
