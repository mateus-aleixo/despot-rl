[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "despot-rl"
version = "0.1.0"
description = "Reinforcement learning on a faithful, datamined simulator of Despot's Game"
readme = "README.md"
requires-python = ">=3.12"

# The simulator itself needs numpy and nothing else; gymnasium and torch are
# here because `rl/` is not optional to the project even though `sim/` runs
# without them. Torch is deliberately unpinned past a floor: the CUDA build is
# a local choice, and `rl/train.py` defaults to `--device cpu`.
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.0",
    "torch>=2.4",
]

[project.optional-dependencies]
# `tools/render_run.py` only. ffmpeg has to be on PATH for the encode step.
render = ["pillow>=10.0"]
# The extraction pipeline, which nobody needs to read the code or to train:
# UnityPy opens the bundles, pycryptodome verifies `tools/rijndael256.py` at
# Nb=4 where Rijndael is AES, and capstone plus pefile disassemble
# GameAssembly.dll.
datamining = [
    "UnityPy>=1.20",
    "pycryptodome>=3.20",
    "capstone>=5.0",
    "pefile>=2023.2.7",
]

[project.urls]
Repository = "https://github.com/mateus-aleixo/despot-rl"

[tool.setuptools]
packages = ["sim", "rl"]
